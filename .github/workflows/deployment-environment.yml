name: Deployment environment safety

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  local-environment-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML
      - run: python -m unittest discover -s .agents/skills/sub2api-production-deploy/scripts/tests/release -p 'test_deployment_environment.py'
      - run: python -m unittest discover -s .agents/skills/sub2api-production-deploy/scripts/tests/release -p 'test_backup_upload_config.py'
      - run: python -m unittest discover -s .agents/skills/sub2api-production-deploy/scripts/tests/release -p 'test_local_deployment_disclosure.py'
